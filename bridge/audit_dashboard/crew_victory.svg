<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <filter id="neon-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Background Void Circle -->
  <circle cx="100" cy="100" r="90" fill="#0d1117" stroke="#2a2a3a" stroke-width="2"/>

  <!-- Chamfered Outer Shield -->
  <polygon points="100,20 170,55 170,145 100,180 30,145 30,55" fill="none" stroke="#00ff88" stroke-width="3" filter="url(#neon-glow)"/>

  <!-- Inner Tech Emblem -->
  <polygon points="100,35 155,62 155,138 100,165 45,138 45,62" fill="rgba(0, 255, 136, 0.05)" stroke="#00d4ff" stroke-width="1.5"/>

  <!-- Central Star / Sigil Motif -->
  <path d="M100,50 L112,85 L145,85 L118,105 L128,140 L100,120 L72,140 L82,105 L55,85 L88,85 Z" fill="#00ff88" opacity="0.85" filter="url(#neon-glow)"/>

  <!-- PCB Circuit Lines -->
  <line x1="30" y1="100" x2="55" y2="100" stroke="#00ff88" stroke-width="2"/>
  <line x1="145" y1="100" x2="170" y2="100" stroke="#00ff88" stroke-width="2"/>
  <circle cx="30" cy="100" r="3" fill="#00ff88"/>
  <circle cx="170" cy="100" r="3" fill="#00ff88"/>

  <!-- Text Badge -->
  <text x="100" y="160" font-family="Orbitron, monospace" font-size="10" font-weight="bold" fill="#00ff88" text-anchor="middle" letter-spacing="2">CREW VICTORY</text>
</svg>
