<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <filter id="magenta-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Background Void Circle -->
  <circle cx="100" cy="100" r="90" fill="#0d1117" stroke="#2a2a3a" stroke-width="2"/>

  <!-- Chamfered Outer Shield (Inverted) -->
  <polygon points="100,180 170,145 170,55 100,20 30,55 30,145" fill="none" stroke="#ff00ff" stroke-width="3" filter="url(#magenta-glow)"/>

  <!-- Inner Hazard Triangle -->
  <polygon points="100,45 155,145 45,145" fill="rgba(255, 0, 255, 0.08)" stroke="#ff3366" stroke-width="2"/>

  <!-- Skull / Biohazard Icon Motif -->
  <circle cx="100" cy="90" r="18" fill="#ff00ff" filter="url(#magenta-glow)"/>
  <rect x="94" y="112" width="12" height="16" fill="#ff00ff"/>
  <line x1="90" y1="128" x2="110" y2="128" stroke="#000000" stroke-width="2"/>

  <!-- PCB Circuit Lines -->
  <line x1="30" y1="100" x2="55" y2="100" stroke="#ff00ff" stroke-width="2"/>
  <line x1="145" y1="100" x2="170" y2="100" stroke="#ff00ff" stroke-width="2"/>

  <!-- Text Badge -->
  <text x="100" y="165" font-family="Orbitron, monospace" font-size="9" font-weight="bold" fill="#ff00ff" text-anchor="middle" letter-spacing="1.5">SABOTEUR VICTORY</text>
</svg>
